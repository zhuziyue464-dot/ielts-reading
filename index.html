<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>雅思阅读精修库</title>
  <meta name="description" content="九分学长 DDDD 阅读题库：中英对照、答案句标黄、题型分类" />

  <!-- PWA / Safari 添加到主屏幕 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="雅思阅读" />
  <meta name="theme-color" content="#0f6b5c" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="backBtn" class="back-btn hidden" aria-label="返回">‹</button>
      <h1 id="pageTitle">雅思阅读精修库</h1>
    </header>

    <!-- 首页：列表 -->
    <section id="listView" class="view">
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="搜索文章标题…" autocomplete="off" />
      </div>
      <div class="filters" id="albumFilters"></div>
      <div class="filters" id="typeFilters"></div>
      <div class="count-line"><span id="countText">共 0 篇</span></div>
      <ul id="articleList" class="article-list"></ul>
    </section>

    <!-- 详情页 -->
    <section id="detailView" class="view hidden"></section>

    <div id="loading" class="loading">加载中…</div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
